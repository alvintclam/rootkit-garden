<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Rootkit Garden · 惡意程式花園</title>
    <meta property="og:title" content="Rootkit Garden · 惡意程式花園" />
    <meta property="og:description" content="種下惡意程式花。花會射擊。修剪回收空位。活下去。直屏手遊。Plant malware flowers. Survive." />
    <meta property="og:image:width" content="720" />
    <meta property="og:image:height" content="1280" />
    <meta name="description" content="種下惡意程式花。花會射擊。修剪回收空位。活下去。直屏手遊。Plant malware flowers. Survive." />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #0b1220;
        color: #c8facc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        height: 100dvh;
        width: 100%;
        padding:
          env(safe-area-inset-top, 0)
          env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
        box-sizing: border-box;
      }
      canvas {
        image-rendering: pixelated;
        background: #071018;
        box-shadow: 0 0 0 2px #1f3d2a, 0 0 40px #0f3;
        /* letterbox to 9:16 inside the safe viewport */
        width: min(100%, calc(100dvh * 9 / 16));
        height: min(100dvh, calc(100% * 16 / 9));
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 9 / 16;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" width="540" height="960" tabindex="0"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
